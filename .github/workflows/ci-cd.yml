# CI/CD for groundtruth.
#
#   pull request      -> test
#   push to main      -> test -> build image -> deploy to Azure Container Apps
#   manual (Run workflow button) -> same as a push, for the chosen branch
#
# Deploy only swaps the image of the app and the scheduled job. Secrets and
# infrastructure are managed by deploy/deploy.sh (see docs/deploy-azure.md), so no
# app secrets live in GitHub. Azure sign-in is OpenID Connect: no stored password.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of racing the older one.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: groundtruth

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        # Fixed image name with a lowercase owner: the repo name ends in a dash,
        # which isn't allowed in an image name.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          # Links the private package to this repo, so this workflow keeps write access.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    # Only main deploys, and only once Azure sign-in is configured (repo variables).
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets azure/login exchange GitHub's OIDC token
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      RG: ${{ vars.AZ_RESOURCE_GROUP }}
      APP: ${{ vars.AZ_APP }}
      JOB: ${{ vars.AZ_JOB }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update app and scheduled job to the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" \
            --revision-suffix "r${{ github.run_number }}-${{ github.run_attempt }}" -o none
          az containerapp job update -g "$RG" -n "$JOB" --image "$IMAGE" -o none

      - name: Health check
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          latest=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
          for i in $(seq 1 24); do   # up to 2 minutes for the new revision to turn ready
            ready=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)
            [ "$ready" = "$latest" ] && break
            sleep 5
          done
          echo "latest revision: $latest, ready: $ready"
          [ "$ready" = "$latest" ] || { echo "::error::new revision $latest never became ready; see its logs"; exit 1; }
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 60 "https://$fqdn/healthz"
          echo "::notice::Deployed $IMAGE to https://$fqdn"
